name: Update Releases JSON

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    types: [closed]
    branches:
      - master
      - main
  release:
    types: [published, edited, deleted]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Releases
      id: get_releases
      run: |
        curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             https://api.github.com/repos/${{ github.repository }}/releases \
             > releases.json

    - name: Generate Changelog
      run: |
        python3 -c "
        import json
        from datetime import datetime
        
        with open('releases.json') as f:
          releases = json.load(f)
        
        filtered_releases = [r for r in releases if not r.get('draft', False) and not r.get('prerelease', False)]
        filtered_releases.sort(key=lambda x: x.get('published_at', ''), reverse=True)
        
        with open('CHANGELOG.md', 'w', encoding='utf-8') as f:
          for release in filtered_releases:
            tag = release.get('tag_name', '')
            name = release.get('name', '') or tag
            published_at = release.get('published_at', '')
            body = release.get('body', '') or 'No release notes provided.'
            
            try:
              if published_at:
                dt = datetime.fromisoformat(published_at.replace('Z', '+00:00'))
                formatted_date = dt.strftime('%B %d, %Y')
              else:
                formatted_date = 'Unknown date'
            except:
              formatted_date = published_at
            
            f.write(f'# {name}\n')
            f.write(f'## Released: {formatted_date}\n\n')
            f.write(f'{body}\n\n')
            f.write('---\n\n')
        "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          releases.json
          CHANGELOG.md

    - name: Commit and push changes
      if: github.ref_type == 'branch'
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        branch: ${{ github.ref_name }}
        commit_message: 'Update releases.json and CHANGELOG.md [skip ci]'
        file_pattern: 'releases.json
CHANGELOG.md'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Delete artifact
      uses: geekyeggo/delete-artifact@v5
      with:
        name: release-files
